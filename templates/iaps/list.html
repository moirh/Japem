{% extends "base.html" %}

{% block title %}IAPs · JAPEM{% endblock %}

{% block content %}
<div class="w-full">
  <div class="flex flex-col sm:flex-row gap-3 sm:justify-between sm:items-center mb-6">
    <h1 class="text-2xl font-bold text-japem-dark">Padrón de IAPs</h1>
    {% if can_edit %}
    <div class="flex items-center gap-3">
      <form method="post" action="{% url 'iaps:importar' %}" enctype="multipart/form-data" class="flex items-center gap-2">
        {% csrf_token %}
        <label class="bg-white border-2 border-japem-green text-japem-green hover:bg-japem-bg px-4 py-2 rounded-xl font-bold text-sm cursor-pointer transition">
          Importar CSV
          <input type="file" name="archivo" accept=".csv" onchange="this.form.submit()" class="hidden">
        </label>
      </form>
      <button
        @click="modalOpen = true"
        hx-get="{% url 'iaps:create' %}"
        hx-target="#modal-content"
        class="bg-japem-green hover:bg-japem-greendark text-white font-bold px-4 py-2 rounded-xl shadow transition"
      >+ Nueva IAP</button>
    </div>
    {% endif %}
  </div>
  {% include "iaps/_table.html" %}
</div>
{% endblock %}
