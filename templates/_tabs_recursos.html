{% with app=request.resolver_match.app_name url=request.resolver_match.url_name %}
<div class="flex flex-wrap justify-center gap-1 sm:gap-2 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100 w-full sm:w-fit mb-4 mx-auto">

  <a href="{% url 'donantes:list' %}"
     class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all cursor-pointer {% if app == 'donantes' %}bg-[#719c44] text-white shadow{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Donantes
  </a>

  <a href="{% url 'donativos:list' %}"
     class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all cursor-pointer {% if app == 'donativos' and url != 'inventario' %}bg-[#719c44] text-white shadow{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"/><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 15 6 6"/><path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A2.73 2.73 0 0 0 16 4a2.78 2.78 0 0 0-5 1.8c0 1.2.8 2 1.5 2.8L16 12Z"/></svg>
    Entradas
  </a>

  <a href="{% url 'iaps:list' %}"
     class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all cursor-pointer {% if app == 'iaps' %}bg-[#719c44] text-white shadow{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
    Instituciones
  </a>

  <a href="{% url 'distribucion:asignar' %}"
     class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all cursor-pointer {% if app == 'distribucion' and url != 'mesa_control' and url != 'entregar_form' and url != 'entregar_confirmar' %}bg-[#719c44] text-white shadow{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
    Distribución
  </a>

  <a href="{% url 'distribucion:mesa_control' %}"
     class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all cursor-pointer {% if url == 'mesa_control' or url == 'entregar_form' or url == 'entregar_confirmar' %}bg-[#719c44] text-white shadow{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
    Entrega
  </a>

  <a href="{% url 'donativos:inventario' %}"
     class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all cursor-pointer {% if url == 'inventario' %}bg-[#719c44] text-white shadow{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
    Inventario
  </a>

</div>
{% endwith %}
