<div id="users-table" class="bg-white rounded-2xl shadow overflow-x-auto">
  <table class="w-full min-w-[640px] text-sm">
    <thead class="bg-japem-bg text-japem-dark text-left">
      <tr>
        <th class="px-4 py-3">Usuario</th>
        <th class="px-4 py-3">Rol</th>
        <th class="px-4 py-3 text-right">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr class="border-t border-japem-accent/20">
        <td class="px-4 py-3">
          <div class="font-bold text-japem-dark">{{ u.name|default:u.username }}</div>
          <div class="text-xs text-japem-muted">@{{ u.username }}</div>
        </td>
        <td class="px-4 py-3">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase border bg-japem-bg text-japem-green border-japem-accent">{{ u.get_role_display }}</span>
        </td>
        <td class="px-4 py-3 text-right space-x-3 whitespace-nowrap">
          <button
            @click="modalOpen = true"
            hx-get="{% url 'accounts:user_update' u.pk %}"
            hx-target="#modal-content"
            class="text-japem-green hover:underline font-medium"
          >Editar</button>
          {% if can_manage and u.pk != user.pk %}
          <button
            hx-post="{% url 'accounts:user_delete' u.pk %}"
            hx-target="#users-table"
            hx-swap="outerHTML"
            hx-confirm="¿Eliminar este usuario?"
            class="text-red-500 hover:underline font-medium"
          >Eliminar</button>
          {% endif %}
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="3" class="px-4 py-8 text-center text-japem-muted">No hay usuarios registrados.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
