{% extends "base.html" %}

{% block title %}Iniciar sesión · JAPEM{% endblock %}

{% block content %}
<main class="w-full min-h-screen flex items-center justify-center bg-japem-bg px-4" x-data="{ showPassword: false }">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-japem-green mb-1">Bienvenido</h1>
      <p class="text-sm text-japem-muted">Ingrese sus credenciales para acceder al panel.</p>
    </div>

    {% if error %}
    <div class="mb-6 p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl text-sm font-medium">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-japem-dark uppercase tracking-wide mb-1.5">Nombre de Usuario</label>
        <input type="text" name="username" required autofocus
               class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-japem-green transition"
               placeholder="Ej. admin.japem">
      </div>
      <div>
        <label class="block text-xs font-bold text-japem-dark uppercase tracking-wide mb-1.5">Contraseña</label>
        <div class="relative">
          <input :type="showPassword ? 'text' : 'password'" name="password" required
                 class="w-full px-4 py-3 pr-16 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-japem-green transition"
                 placeholder="••••••••">
          <button type="button" @click="showPassword = !showPassword"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-japem-muted hover:text-japem-green">
            <span x-show="!showPassword">Ver</span>
            <span x-show="showPassword" x-cloak>Ocultar</span>
          </button>
        </div>
      </div>
      <button type="submit"
              class="w-full py-3.5 bg-japem-green hover:bg-japem-greendark text-white font-bold rounded-xl shadow-lg shadow-japem-green/30 transition">
        Iniciar Sesión
      </button>
    </form>

    <p class="text-center text-xs text-japem-muted mt-8">
      &copy; Junta de Asistencia Privada del Estado de México
    </p>
  </div>
</main>
{% endblock %}
