{% extends "base.html" %}

{% block title %}Usuarios · JAPEM{% endblock %}

{% block content %}
<div class="w-full px-4 sm:px-6 py-6">
  <div class="flex flex-col sm:flex-row gap-3 sm:justify-between sm:items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-japem-dark">Directorio de Usuarios</h1>
      <p class="text-sm text-japem-muted">Administra los accesos a la plataforma.</p>
    </div>
    {% if can_manage %}
    <button
      @click="modalOpen = true"
      hx-get="{% url 'accounts:user_create' %}"
      hx-target="#modal-content"
      class="bg-japem-green hover:bg-japem-greendark text-white font-bold px-4 py-2 rounded-xl shadow transition"
    >+ Nuevo Usuario</button>
    {% endif %}
  </div>
  {% include "accounts/_user_table.html" %}
</div>
{% endblock %}
