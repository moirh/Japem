{# Badge de rol con los colores de getRoleBadge() en SettingsModal.tsx #}
<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase border
  {% if role == 'superadmin' %}bg-purple-100 text-purple-700 border-purple-200{% elif role == 'admin' %}bg-blue-100 text-blue-700 border-blue-200{% elif role == 'editor' %}bg-orange-100 text-orange-700 border-orange-200{% elif role == 'donativos' %}bg-emerald-100 text-emerald-700 border-emerald-200{% elif role == 'asistencial' %}bg-rose-100 text-rose-700 border-rose-200{% else %}bg-gray-100 text-gray-600 border-gray-200{% endif %}">
  {{ role|default:"lector" }}
</span>
