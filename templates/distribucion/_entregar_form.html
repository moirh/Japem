{% extends "_modal.html" %}

{% block size %}max-w-4xl{% endblock %}

{% block title %}Confirmar Salida de Almacén{% endblock %}

{% block body %}
<form method="post" action="{% url 'distribucion:entregar_confirmar' asignacion.pk %}" class="space-y-6 p-1">
  {% csrf_token %}

  <div class="bg-[#f2f5f0] p-6 rounded-2xl border border-[#c0c6b6]">
    <h3 class="text-sm font-extrabold text-[#719c44] uppercase tracking-wide flex items-center gap-2 mb-4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      Detalles de la Asignación
    </h3>
    <p class="text-sm text-[#817e7e]">
      Asignación <span class="font-bold text-[#353131]">#{{ asignacion.pk }}</span> para
      <span class="font-bold text-[#353131]">{{ asignacion.iap.nombre_iap }}</span>
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold text-[#353131] uppercase mb-1">Responsable JAPEM</label>
      <select name="responsable_entrega" required
              class="w-full px-4 py-3 bg-white border-2 border-[#e5e7eb] rounded-xl text-[#353131] focus:outline-none focus:border-[#719c44] focus:ring-4 focus:ring-[#719c44]/10 transition">
        <option value="">-- Seleccionar --</option>
        <option value="Yuri">Yuri</option>
        <option value="Alex">Alex</option>
        <option value="Juanita">Juanita</option>
        <option value="Marco">Marco</option>
        <option value="Dafne">Dafne</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-[#353131] uppercase mb-1">Lugar</label>
      <select name="lugar_entrega"
              class="w-full px-4 py-3 bg-white border-2 border-[#e5e7eb] rounded-xl text-[#353131] focus:outline-none focus:border-[#719c44] focus:ring-4 focus:ring-[#719c44]/10 transition">
        <option value="Oficinas JAPEM">Oficinas JAPEM</option>
        <option value="Instalaciones de la IAP">Instalaciones de la IAP</option>
        <option value="Evento / Otro">Evento / Otro</option>
      </select>
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-[#c0c6b6]/30">
    <button type="button" @click="modalOpen = false"
            class="cursor-pointer px-6 py-3 text-[#817e7e] font-bold hover:bg-[#f2f5f0] rounded-xl transition-all">
      Cancelar
    </button>
    <button type="submit"
            class="cursor-pointer px-8 py-3 bg-[#719c44] hover:bg-[#5e8239] text-white font-bold rounded-xl shadow-lg shadow-[#719c44]/30 transition-all transform active:scale-95">
      Confirmar Entrega
    </button>
  </div>
</form>
{% endblock %}
