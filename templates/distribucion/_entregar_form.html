<div class="p-6">
  <h2 class="text-xl font-bold text-japem-dark mb-1">Confirmar Salida de Almacén</h2>
  <p class="text-sm text-japem-muted mb-4">Asignación #{{ asignacion.pk }} para <span class="font-bold text-japem-dark">{{ asignacion.iap.nombre_iap }}</span></p>

  <form method="post" action="{% url 'distribucion:entregar_confirmar' asignacion.pk %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-bold text-japem-dark uppercase mb-1">Responsable JAPEM</label>
      <select name="responsable_entrega" required class="w-full px-3 py-2.5 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-japem-green transition">
        <option value="">-- Seleccionar --</option>
        <option value="Yuri">Yuri</option>
        <option value="Alex">Alex</option>
        <option value="Juanita">Juanita</option>
        <option value="Marco">Marco</option>
        <option value="Dafne">Dafne</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-japem-dark uppercase mb-1">Lugar</label>
      <select name="lugar_entrega" class="w-full px-3 py-2.5 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:bg-white focus:border-japem-green transition">
        <option value="Oficinas JAPEM">Oficinas JAPEM</option>
        <option value="Instalaciones de la IAP">Instalaciones de la IAP</option>
        <option value="Evento / Otro">Evento / Otro</option>
      </select>
    </div>
    <div class="flex justify-end gap-3 pt-4">
      <button type="button" @click="modalOpen = false" class="px-4 py-2 rounded-xl text-japem-dark hover:bg-japem-bg transition">Cancelar</button>
      <button type="submit" class="px-4 py-2 rounded-xl bg-japem-green hover:bg-japem-greendark text-white font-bold transition">Confirmar</button>
    </div>
  </form>
</div>
