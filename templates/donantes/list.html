{% extends "base.html" %}

{% block title %}Donantes · JAPEM{% endblock %}

{% block content %}
<div class="w-full">
  <div class="flex flex-col sm:flex-row gap-3 sm:justify-between sm:items-center mb-6">
    <h1 class="text-2xl font-bold text-japem-dark">Donantes</h1>
    {% if can_edit %}
    <button
      @click="modalOpen = true"
      hx-get="{% url 'donantes:create' %}"
      hx-target="#modal-content"
      class="bg-japem-green hover:bg-japem-greendark text-white font-bold px-4 py-2 rounded-xl shadow transition"
    >+ Nuevo Donante</button>
    {% endif %}
  </div>
  {% include "donantes/_table.html" %}
</div>
{% endblock %}
