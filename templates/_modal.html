<div id="modal-panel"
     class="bg-white rounded-2xl shadow-2xl w-full {% block size %}max-w-md{% endblock %} max-h-[95vh] flex flex-col overflow-hidden ring-1 ring-black/5 animate-modal-in">

  {# Encabezado verde degradado (variant="japem") #}
  <div class="flex justify-between items-center p-5 shrink-0 bg-gradient-to-r from-[#719c44] to-[#8eb563] text-white shadow-md">
    <div class="flex items-center gap-3">
      <div class="p-2 rounded-lg bg-white/20 text-white backdrop-blur-sm shadow-sm empty:hidden">{% block icon %}{% endblock %}</div>
      <h3 class="text-xl font-bold leading-tight tracking-tight">{% block title %}{% endblock %}</h3>
    </div>
    <button type="button" @click="modalOpen = false" title="Cerrar"
            class="cursor-pointer p-2 rounded-full transition-all duration-300 transform hover:rotate-90 text-white/80 hover:bg-white/20 hover:text-white">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  {# Cuerpo con scroll #}
  <div class="flex-1 overflow-y-auto bg-[#f9fafb]">
    <div class="p-6">
      {% block body %}{% endblock %}
    </div>
  </div>
</div>
