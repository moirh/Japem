{% extends "base.html" %}

{% block title %}Inventario · JAPEM{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-6 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-japem-dark">Inventario</h1>
    <input
      type="search"
      name="search"
      value="{{ search }}"
      placeholder="Buscar producto..."
      hx-get="{% url 'donativos:inventario' %}"
      hx-trigger="keyup changed delay:400ms, search"
      hx-target="#inventario-table"
      hx-swap="outerHTML"
      class="px-4 py-2 border-2 border-gray-200 rounded-xl w-64 focus:outline-none focus:bg-white focus:border-japem-green transition"
    >
  </div>
  {% include "donativos/_inventario_table.html" %}
</div>
{% endblock %}
